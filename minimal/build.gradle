buildscript {
    repositories {
        mavenLocal()
        mavenCentral()
        maven {
            url = "https://plugins.gradle.org/m2/"
        }
        maven {
            url = "https://oss.sonatype.org/content/repositories/snapshots/"
            name = "sonatype"
        }
        maven {
            url = "https://maven.atlassian.com/3rdparty/"
        }
        google()
    }
    dependencies {
        classpath "commons-io:commons-io:2.22.0"
        classpath "com.google.code.gson:gson:2.14.0"
    }
}

plugins {
    id "groovy"
    id "eclipse"
}

group project_group // http://maven.apache.org/guides/mini/guide-naming-conventions.html

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

println("Current version: $version")
println("Project: $group:${project.name}")
println("Bulding a Java $compileJava.targetCompatibility project...")

repositories {
    mavenCentral()
}

configurations {
    // configuration that holds jars to include in the jar
    implementation
    addToJar {
        canBeResolved true
    }
}

dependencies {
    // LibGDX
    implementation "com.badlogicgames.gdx:gdx:1.14.2"
    implementation "com.badlogicgames.gdx:gdx-box2d:1.14.2"
    implementation "com.badlogicgames.ashley:ashley:1.7.4"
    implementation "com.badlogicgames.gdx:gdx-ai:1.8.2"
    implementation "com.badlogicgames.gdx-controllers:gdx-controllers-core:2.2.4"
    implementation "com.badlogicgames.gdx:gdx-freetype:1.14.2"
    implementation "com.badlogicgames.box2dlights:box2dlights:1.5"
    implementation "space.earlygrey:shapedrawer:2.6.0"

    implementation "com.badlogicgames.gdx:gdx-backend-lwjgl3:1.14.2"
    implementation "com.badlogicgames.gdx:gdx-platform:1.14.2:natives-desktop"
    implementation "com.badlogicgames.gdx:gdx-box2d-platform:1.14.2:natives-desktop"
    implementation "com.badlogicgames.gdx:gdx-bullet-platform:1.14.2:natives-desktop"
    implementation "com.badlogicgames.gdx-controllers:gdx-controllers-desktop:2.2.4"
    implementation "com.badlogicgames.gdx:gdx-freetype-platform:1.14.2:natives-desktop"

    implementation "com.google.guava:guava:33.7.1-jre"
    implementation "com.google.code.gson:gson:2.14.0"
    implementation "org.jetbrains:annotations:26.1.0"
    
    // Fabric
    implementation "org.ow2.asm:asm:9.11.1"
    implementation "org.ow2.asm:asm-analysis:9.11.1"
    implementation "org.ow2.asm:asm-commons:9.11.1"
    implementation "org.ow2.asm:asm-tree:9.11.1"
    implementation "org.ow2.asm:asm-util:9.11.1"

    implementation("net.fabricmc:sponge-mixin:0.17.5+mixin.0.8.7") {
        exclude module: 'launchwrapper'
        exclude module: 'guava'
        exclude module: 'gson'
    }

    implementation "com.badlogicgames.gdx:gdx-backend-lwjgl3:1.14.2"

    implementation "it.unimi.dsi:fastutil-core:8.5.19"
    implementation "com.google.code.findbugs:jsr305:3.0.2"
    testImplementation "org.junit.jupiter:junit-jupiter-api:6.1.3"
    testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine:6.1.3"

    implementation "org.xbib.elasticsearch:joptsimple:6.3.2.1"

    implementation("net.fabricmc:fabric-loader:0.20.1") {
        exclude group: "org.ow2.asm"
        exclude group: "org.ow2.sat4j"
    }
}

processResources {
    inputs.property "version", version
    inputs.property "bubbles_version", project(":core").version
    inputs.property "libgdx_version", gdx_version

    filesMatching("fabric.mod.json") {
        expand "version": version
    }

    filesMatching("bubbles.metadata.json") {
        expand "version": version
    }

    filesMatching("versions.properties") {
        expand "bubbles_version": project(":core").version, "libgdx_version": gdx_version
    }

    exclude("**/*.pdn")
    exclude("**/*.xcf")
    exclude("**/*.ps")
    exclude("**/*.tmp")
    exclude("**/*.bak")
    exclude("**/*.temp")
    exclude("**/*.cache")
    exclude("**/.cache")
}

repositories {
    maven {
        url = "https://maven.fabricmc.net"
        name = "FabricMC"
    }
}

jar {
    manifest {
        attributes 'Implementation-Title': 'Bubble Blaster',
                'Implementation-Vendor': 'Ultreon Team',
                project_version: project.version,
                'Main-Class': 'net.fabricmc.impl.launch.knot.KnotClient',
                'Multi-Release': 'true'
    }
    from(configurations.addToJar.collect {
        zipTree(it).matching {
            exclude "*.RSA", "*.SF", "*.MF"
        }
    })
    exclude "*.RSA", "*.SF", "*.MF"
    duplicatesStrategy DuplicatesStrategy.INCLUDE
}
test {
    useJUnitPlatform()
}
