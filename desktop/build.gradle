//file:noinspection GroovyUnusedCatchParameter

import java.nio.file.Files
import java.nio.file.Paths

buildscript {
    repositories {
        mavenCentral()

        maven {
            url = "https://oss.sonatype.org/content/repositories/snapshots/"
            name = "sonatype"
        }

        maven {
            url = "https://maven.atlassian.com/3rdparty/"
        }

        google()
    }

    dependencies {
        classpath group: 'commons-io', name: 'commons-io', version: "2.22.0"
        classpath "com.google.code.gson:gson:2.10.1"
    }
}

//*****************//
//     Plugins     //
//*****************//
plugins {
    id 'java'
    id 'java-library'
    id 'maven-publish'
}

//****************************//
// Setting up main properties //
//****************************//

// Project properties.
group project_group

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

evaluationDependsOn(":core")

dependencies {
    implementation project(":gameprovider")
    implementation project(":core")

    // Annotations
    implementation "org.jetbrains:annotations:23.0.0"

    // Test dependencies
    testImplementation "org.junit.jupiter:junit-jupiter-api:5.9.0"
    testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine:5.9.0"

    // FastUtil
    implementation "it.unimi.dsi:fastutil:8.5.9"
    implementation "it.unimi.dsi:fastutil-extra:8.5.4"
    implementation "it.unimi.dsi:fastutil-core:8.5.9"

    // Misc
    implementation "org.jetbrains:annotations:23.0.0"
    implementation "com.electronwill.night-config:toml_android:3.6.6"

    // CoreLibs
    implementation "dev.ultreon.corelibs:collections-v0:0.3.0"
    implementation "dev.ultreon.corelibs:commons-v0:0.3.0"
    implementation "dev.ultreon.corelibs:crash-v0:0.3.0"
    implementation "dev.ultreon.corelibs:datetime-v0:0.3.0"
    implementation "dev.ultreon.corelibs:events-v1:0.3.0"
    implementation "dev.ultreon.corelibs:functions-v0:0.3.0"
    implementation "dev.ultreon.corelibs:registries-v0:0.3.0"
    implementation "dev.ultreon.corelibs:resources-v0:0.3.0"
    implementation "dev.ultreon.corelibs:text-v0:0.3.0"
    implementation "dev.ultreon.corelibs:translations-v0:0.3.0"
    implementation "dev.ultreon.corelibs:translations-v1:0.3.0"

    // Apis
    implementation "commons-io:commons-io:2.22.0"
    implementation "org.apache.commons:commons-lang3:3.21.0"
    implementation "org.apache.commons:commons-collections4:4.4"
    implementation "org.apache.commons:commons-text:1.10.0"
    implementation "org.apache.commons:commons-math3:3.6.1"
    implementation "org.apache.ant:ant:1.0.18"

    // Local jars.
    implementation fileTree(dir: "$projectDir/libs", include: ["*.jar"])

    // Google
    implementation "com.google.code.findbugs:jsr305:3.0.2"
    implementation "com.google.guava:guava:33.7.1-jre"
    implementation "com.google.code.gson:gson:2.10.1!!"

    // SLF4J
    implementation "org.slf4j:slf4j-api:2.0.6"

    // OSHi (For system info in crash reports)
    implementation "com.github.oshi:oshi-core:6.3.2"

    // LibGDX
    implementation "com.badlogicgames.gdx:gdx-backend-lwjgl3:1.14.2"
    implementation "com.badlogicgames.gdx:gdx-platform:1.14.2:natives-desktop"
    implementation "com.badlogicgames.gdx-controllers:gdx-controllers-desktop:2.2.3"
    implementation "com.badlogicgames.gdx:gdx-freetype-platform:1.14.2:natives-desktop"
    implementation "com.badlogicgames.gdx:gdx-box2d-platform:1.14.2:natives-desktop"

    // GDX Visual Effects
    implementation 'com.crashinvaders.vfx:gdx-vfx-core:0.5.0'
    implementation 'com.crashinvaders.vfx:gdx-vfx-effects:0.5.0'    // Optional, if you need standard filter/effects.

    // JNA
    implementation "net.java.dev.jna:jna:5.13.0"
    implementation "net.java.dev.jna:jna-platform:5.13.0"

    // SLF4J
    implementation "org.slf4j:slf4j-api:2.0.6"

    // Google
    implementation "com.google.code.gson:gson:2.10.1"
    implementation 'com.google.guava:guava:33.7.1-jre'

    // Misc
    implementation 'it.unimi.dsi:fastutil:8.5.12'

    implementation "space.earlygrey:shapedrawer:2.6.0"

    // ImGui
    implementation "io.github.spair:imgui-java-binding:1.89.0"
    implementation "io.github.spair:imgui-java-lwjgl3:1.89.0", {
        exclude group: 'org.lwjgl', module: 'lwjgl'
        exclude group: 'org.lwjgl', module: 'lwjgl-bom'
        exclude group: 'org.lwjgl', module: 'lwjgl-glfw'
        exclude group: 'org.lwjgl', module: 'lwjgl-opengl'
    }
    implementation "io.github.spair:imgui-java-natives-linux:1.89.0"
    implementation "io.github.spair:imgui-java-natives-macos:1.89.0"
    implementation "io.github.spair:imgui-java-natives-windows:1.89.0"

    implementation "it.unimi.dsi:fastutil-core:8.5.9"
    implementation "com.google.code.findbugs:jsr305:3.0.2"
    testImplementation "org.junit.jupiter:junit-jupiter-api:5.9.0"
    testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine:5.9.0"

    implementation "org.xbib.elasticsearch:joptsimple:6.3.2.1"

    // ImGui
    implementation "io.github.spair:imgui-java-binding:1.89.0"
    implementation "io.github.spair:imgui-java-lwjgl3:1.89.0", {
        exclude group: 'org.lwjgl', module: 'lwjgl'
        exclude group: 'org.lwjgl', module: 'lwjgl-bom'
        exclude group: 'org.lwjgl', module: 'lwjgl-glfw'
        exclude group: 'org.lwjgl', module: 'lwjgl-opengl'
    }

    implementation "io.github.spair:imgui-java-natives-linux:1.89.0"
    implementation "io.github.spair:imgui-java-natives-macos:1.89.0"
    implementation "io.github.spair:imgui-java-natives-windows:1.89.0"

    // fabric-loader dependencies
    implementation "org.ow2.asm:asm:9.11.1"
    implementation "org.ow2.asm:asm-analysis:9.11.1"
    implementation "org.ow2.asm:asm-commons:9.11.1"
    implementation "org.ow2.asm:asm-tree:9.11.1"
    implementation "org.ow2.asm:asm-util:9.11.1"

    implementation("net.fabricmc:sponge-mixin:0.17.5+mixin.0.8.7") {
        exclude module: 'launchwrapper'
        exclude module: 'guava'
        exclude module: 'gson'
    }

    implementation 'net.fabricmc:tiny-mappings-parser:0.3.0+build.17'
    implementation 'net.fabricmc:tiny-remapper:0.8.5'
    implementation 'net.fabricmc:dev-launch-injector:0.2.1+build.8'
    implementation 'net.fabricmc:access-widener:2.1.0'

    implementation("net.fabricmc:fabric-loader:0.20.1")
}

processResources {
    from(file("$rootProject.projectDir/LICENSE")) { into "META-INF/" }
    exclude("**/*.pdn")
    exclude("**/*.xcf")
    exclude("**/*.ps")
    exclude("**/*.tmp")
    exclude("**/*.bak")
    exclude("**/*.temp")
    exclude("**/*.cache")
    exclude("**/.cache")

    inputs.property "version", rootProject.version

    filesMatching("metadata.json") {
        expand(["version": rootProject.version])
    }
    duplicatesStrategy DuplicatesStrategy.INCLUDE
}

jar {
    //noinspection GroovyAssignabilityCheck
    manifest {
        //noinspection GroovyAssignabilityCheck
        attributes 'Implementation-Title': 'Bubble Blaster',
                'Implementation-Vendor': 'Ultreon Team',
                project_version: project.project_version,
                'Main-Class': 'dev.ultreon.craft.DesktopLauncher',
                'Multi-Release': 'true'
    }

    from {
        compileJava.outputs
    }
    from {
        processResources.outputs
    }

    zip64 true
    duplicatesStrategy DuplicatesStrategy.INCLUDE
}

tasks.register('prepareRun', {
    Files.createDirectories(Paths.get(rootProject.projectDir.getAbsolutePath(), "run"))
})

tasks.withType(JavaCompile).configureEach {
    options.fork = true
    options.incremental = true
}

tasks.withType(ProcessResources).configureEach {
    duplicatesStrategy DuplicatesStrategy.INCLUDE
}

tasks.withType(Jar).configureEach {
    duplicatesStrategy DuplicatesStrategy.INCLUDE
}

tasks.register('copyDependencies', Copy) {
    from(configurations.runtimeClasspath)
    into("${layout.buildDirectory.asFile.get()}/jars")
}

tasks.register("run", JavaExec) {
    dependsOn classes, ":core:build"
    mainClass = "net.fabricmc.loader.launch.knot.KnotClient"
    classpath = sourceSets.main.runtimeClasspath + sourceSets.main.output
    workingDir = rootProject.file("run")

    if (System.getProperty("os.name").contains("Mac")) {
        jvmArgs += "-XstartOnFirstThread"
    }
}

tasks.register('copyJar', Copy) {
    from(tasks.jar)
    into("${layout.buildDirectory.asFile.get()}/jars")
}

compileJava {
    options.encoding = "UTF-8"
}
