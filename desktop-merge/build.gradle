//file:noinspection GroovyUnusedCatchParameter
//file:noinspection JavaPluginLanguageLevel


import org.panteleyev.jpackage.ImageType
import org.panteleyev.jpackage.JPackageTask

import java.nio.file.Files
import java.nio.file.Paths

buildscript {
    repositories {
        mavenCentral()

        maven {
            url = "https://oss.sonatype.org/content/repositories/snapshots/"
            name = "sonatype"
        }

        maven {
            url = "https://maven.atlassian.com/3rdparty/"
        }

        google()
    }

    dependencies {
        classpath "commons-io:commons-io:2.22.0"
        classpath "com.google.code.gson:gson:2.14.0"
    }
}

//*****************//
//     Plugins     //
//*****************//
plugins {
    //noinspection JavaPluginLanguageLevel
    id "java"
    //noinspection JavaPluginLanguageLevel
    id "java-library"
    id "org.panteleyev.jpackageplugin" version "1.5.0"
}

apply plugin: 'maven-publish'

evaluationDependsOn ":"

//****************************//
// Setting up main properties //
//****************************//

// Project properties.
group project_group

def packageVersion = "1.0.0"

java {
    withSourcesJar()
    withJavadocJar()
}

repositories {
    maven {
        url = "https://maven.fabricmc.net"
        name = "FabricMC"
    }
    maven { url = "https://maven.ultreon.dev/releases" }
    maven { url = "https://maven.ultreon.dev/snapshots" }
}

configurations {
    addToJar {
        canBeResolved true
    }
}

dependencies {
    addToJar(project(":gameprovider"))
    pack implementation(project(":core"))
    pack implementation(project(":desktop"))

    pack implementation("com.badlogicgames.gdx:gdx:1.14.2")
    pack implementation("com.badlogicgames.gdx:gdx-box2d:1.14.2")
    pack implementation("com.badlogicgames.ashley:ashley:1.7.4")
    pack implementation("com.badlogicgames.gdx:gdx-ai:1.8.2")
    pack implementation("com.badlogicgames.gdx-controllers:gdx-controllers-core:2.2.3")
    pack implementation("com.badlogicgames.gdx:gdx-freetype:1.14.2")
    pack implementation("com.badlogicgames.box2dlights:box2dlights:1.5")

    pack implementation("com.badlogicgames.gdx:gdx-backend-lwjgl3:1.14.2")
    pack implementation("com.badlogicgames.gdx:gdx-platform:1.14.2:natives-desktop")
    pack implementation("com.badlogicgames.gdx:gdx-box2d-platform:1.14.2:natives-desktop")
    pack implementation("com.badlogicgames.gdx:gdx-bullet-platform:1.14.2:natives-desktop")
    pack implementation("com.badlogicgames.gdx-controllers:gdx-controllers-desktop:2.2.3")
    pack implementation("com.badlogicgames.gdx:gdx-freetype-platform:1.14.2:natives-desktop")

    // JNA
    pack implementation("net.java.dev.jna:jna:5.13.0")
    pack implementation("net.java.dev.jna:jna-platform:5.13.0")

    // SLF4J
    pack implementation("org.slf4j:slf4j-api:2.0.6")

    // Google
    pack implementation("com.google.code.gson:gson:2.10.1")
    pack implementation('com.google.guava:guava:33.7.1-jre')

    // Misc
    pack implementation('it.unimi.dsi:fastutil:8.5.12')

    pack implementation("space.earlygrey:shapedrawer:2.6.0")

    // ImGui
    pack implementation("io.github.spair:imgui-java-binding:1.89.0")
    pack implementation("io.github.spair:imgui-java-lwjgl3:1.89.0") {
        exclude group: 'org.lwjgl', module: 'lwjgl'
        exclude group: 'org.lwjgl', module: 'lwjgl-bom'
        exclude group: 'org.lwjgl', module: 'lwjgl-glfw'
        exclude group: 'org.lwjgl', module: 'lwjgl-opengl'
    }
    pack implementation("io.github.spair:imgui-java-natives-linux:1.89.0")
    pack implementation("io.github.spair:imgui-java-natives-macos:1.89.0")
    pack implementation("io.github.spair:imgui-java-natives-windows:1.89.0")

    pack implementation("it.unimi.dsi:fastutil-core:8.5.9")
    pack implementation("com.google.code.findbugs:jsr305:3.0.2")
    pack testImplementation("org.junit.jupiter:junit-jupiter-api:5.9.0")
    pack testRuntimeOnly("org.junit.jupiter:junit-jupiter-engine:5.9.0")

    pack implementation("org.xbib.elasticsearch:joptsimple:6.3.2.1")

    // fabric-loader dependencies
    pack implementation("org.ow2.asm:asm:9.11.1")
    pack implementation("org.ow2.asm:asm-analysis:9.11.1")
    pack implementation("org.ow2.asm:asm-commons:9.11.1")
    pack implementation("org.ow2.asm:asm-tree:9.11.1")
    pack implementation("org.ow2.asm:asm-util:9.11.1")

    pack implementation("net.fabricmc:sponge-mixin:0.17.5+mixin.0.8.7") {
        exclude(module: 'launchwrapper')
        exclude(module: 'guava')
        exclude(module: 'gson')
    }

    //noinspection GradleDynamicVersion
    pack implementation('net.fabricmc:tiny-mappings-parser:0.3.0+build.17')
    pack implementation('net.fabricmc:tiny-remapper:0.8.7')
    //noinspection GradleDynamicVersion
    pack implementation('net.fabricmc:dev-launch-injector:0.2.1+build.8')
    pack implementation('net.fabricmc:access-widener:2.1.0')

    pack compileOnly("net.fabricmc:fabric-loader:0.20.1")
}

processResources {
    from(file("$rootProject.projectDir/LICENSE")) { into "META-INF/" }
    exclude("**/*.pdn")
    exclude("**/*.xcf")
    exclude("**/*.ps")
    exclude("**/*.tmp")
    exclude("**/*.bak")
    exclude("**/*.temp")
    exclude("**/*.cache")
    exclude("**/.cache")

    duplicatesStrategy DuplicatesStrategy.INCLUDE
}

jar {
    dependsOn ":gameprovider:build"
    dependsOn ":desktop:build"
    dependsOn ":core:build"
    //noinspection GroovyAssignabilityCheck
    manifest {
        //noinspection GroovyAssignabilityCheck
        attributes 'Implementation-Title': 'Bubble Blaster',
                'Implementation-Vendor': 'Ultreon Team',
                project_version: project.project_version,
                'Main-Class': 'dev.ultreon.craft.DesktopLauncher',
                'Multi-Release': 'true'
    }

    from(configurations.addToJar.collect {
        zipTree(it).matching {
            exclude "*.RSA", "*.SF", "*.MF"
        }
    })
    from {
        compileJava.outputs
    }
    from {
        processResources.outputs
    }

    exclude "*.RSA", "*.SF", "*.MF"

    zip64 true
    duplicatesStrategy DuplicatesStrategy.INCLUDE

    doLast {
        println "DESK_MERGE FILE: ${file("${layout.buildDirectory.asFile.get()}/libs/").list().toArrayString()}"
        println "CORE FILE: ${file("${project(":core").layout.buildDirectory.asFile.get()}/libs/").list().toArrayString()}"
        println "DESKTOP FILE: ${file("${project(":desktop").layout.buildDirectory.asFile.get()}/libs/").list().toArrayString()}"
        println "GAMEPROVIDER FILE: ${file("${project(":gameprovider").layout.buildDirectory.asFile.get()}/libs/").list().toArrayString()}"
    }
}

tasks.register('prepareRun', {
    Files.createDirectories(Paths.get(rootProject.projectDir.getAbsolutePath(), "run"))
})

tasks.withType(JavaCompile).configureEach {
    options.fork = true
    options.incremental = true
}

tasks.withType(ProcessResources).configureEach {
    duplicatesStrategy DuplicatesStrategy.INCLUDE
}

tasks.withType(Jar).configureEach {
    duplicatesStrategy DuplicatesStrategy.INCLUDE
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

delete "${layout.buildDirectory.asFile.get()}/jars"

tasks.register('copyDependencies', Copy) {
    from(configurations.runtimeClasspath)
    exclude "lwjgl-2.9.3.jar"
    exclude "lwjgl-platform-2.9.3.jar"
    exclude "lwjgl-platform-2.9.3-*.jar"
    into("${layout.buildDirectory.asFile.get()}/jars")
}

tasks.register('copyJar', Copy) {
    from(tasks.jar)
    into("${layout.buildDirectory.asFile.get()}/jars")
}

tasks.register('package', Zip) {
    dependsOn("build", ":gameprovider:build", ":desktop:build", ":core:build", "copyDependencies", "copyJar")

    from fileTree(dir: "${layout.buildDirectory.asFile.get()}/jars", include: "*.jar")
    archiveFileName.set 'package.zip'
    destinationDirectory.set(file("${rootProject.layout.buildDirectory.asFile.get()}/dist/"))
}

final vmArgs = ["-Dfile.encoding=UTF-8", "-Dfabric.skipMcProvider=true", "-Xmx4G", "-Xms256M",
                "-Dbubbles.packaged=true", "-Dbubbles.packageType=jpackage", "-Dbubbles.version=${project.version}"
]
jpackage {
    dependsOn("build", ":gameprovider:build", ":desktop:build", ":core:build", "copyDependencies", "copyJar")

    inputs.files(fileTree("${layout.buildDirectory.asFile.get()}/jars"))

    input = "${layout.buildDirectory.asFile.get()}/jars"
    destination = "${layout.buildDirectory.asFile.get()}/bin"

    appName = project.property("app_name").toString()
    appVersion = project.version.toString()
    vendor = "Ultreon Team"
    copyright = "Copyright (c) 2023 Ultreon Team"
    runtimeImage = System.getProperty("java.home")

//    mainJar = "fabric-loader-${fabric_loader_version}.jar"
    mainJar = jar.archiveFileName.get()
    mainClass = "dev.ultreon.bubbles.premain.PreMain"

    destination = "${layout.buildDirectory.asFile.get()}/dist"

    licenseFile = "$rootProject.projectDir/package/LICENSE.txt"

    javaOptions = vmArgs
    arguments = ["--packaged"]

    aboutUrl = "https://github.com/Ultreon/bubble-blaster"

    mac {
        icon = "$rootProject.projectDir/icons/icon.icns"
        macPackageIdentifier = project_id
        macPackageName = project_name
        appVersion = packageVersion
        javaOptions = javaOptions + ["-XstartOnFirstThread", "-Dbubbles.packageFormat=dmg"]
    }

    linux {
        icon = "$rootProject.projectDir/icons/icon.png"
        linuxPackageName = project_name
        linuxDebMaintainer = "Ultreon Team"
        linuxRpmLicenseType = "Ultreon API License v1.1"
        linuxAppRelease = "2"
        linuxShortcut = true
        javaOptions = javaOptions + ["-Dbubbles.packageFormat=deb"]
        appVersion = project.version.toString()
    }

    windows {
        icon = "$rootProject.projectDir/icons/icon.ico"
        winMenu = true
        winDirChooser = true
        winConsole = false
        winPerUserInstall = true
        winShortcutPrompt = true
        winShortcut = false
        winUpgradeUuid = "a539b496-ae50-4df2-9a1b-8a089e44f7ce"
        winMenuGroup = "Ultreon Team"
        winConsole = false
        javaOptions = javaOptions + ["-Dbubbles.packageFormat=exe"]
        appVersion = (project.version).toString().replaceAll("-cb\\.\\d+", "").replace("+", ".")
        type = ImageType.MSI
    }
}

tasks.register('jpackageAlt', JPackageTask) {
    dependsOn("build", ":gameprovider:build", ":desktop:build", ":core:build", "copyDependencies", "copyJar")

    inputs.files(fileTree("${layout.buildDirectory.asFile.get()}/jars"))

    input = "${layout.buildDirectory.asFile.get()}/jars"
    destination = "${layout.buildDirectory.asFile.get()}/bin"

    appName = project.property("app_name").toString()
    appVersion = project.version.toString()
    vendor = "Ultreon Team"
    copyright = "Copyright (c) 2023 Ultreon Team"
    runtimeImage = System.getProperty("java.home")

    mainJar = jar.archiveFileName.get()
    mainClass = "dev.ultreon.bubbles.premain.PreMain"

    destination = "${layout.buildDirectory.asFile.get()}/dist"

    javaOptions = vmArgs
    arguments = ["--packaged"]

    mac {
        icon = "$rootProject.projectDir/icons/icon.icns"
        macPackageIdentifier = project_id
        macPackageName = project_name
        appVersion = packageVersion
        javaOptions = javaOptions + ["-XstartOnFirstThread", "-Dbubbles.packageFormat=appimage"]
        type = ImageType.APP_IMAGE
    }

    linux {
        icon = "$rootProject.projectDir/icons/icon.png"
        appVersion = project.version.toString()
        javaOptions = javaOptions + ["-Dbubbles.packageFormat=appimage"]
        type = ImageType.APP_IMAGE
    }

    windows {
        icon = "$rootProject.projectDir/icons/icon.ico"
        winConsole = false
        appVersion = (project.version).toString().replaceAll("-cb\\.\\d+", "").replace("+", ".")
        javaOptions = javaOptions + ["-Dbubbles.packageFormat=appimage"]
        type = ImageType.APP_IMAGE
    }
}

