buildscript {
    repositories {
        mavenLocal()
        mavenCentral()
        maven {
            url = "https://plugins.gradle.org/m2/"
        }
        maven {
            url = "https://oss.sonatype.org/content/repositories/snapshots/"
            name = "sonatype"
        }
        maven {
            url = "https://maven.atlassian.com/3rdparty/"
        }
        google()
    }
    dependencies {
        classpath "commons-io:commons-io:2.22.0"
        classpath "com.google.code.gson:gson:2.14.0"
    }
}

plugins {
    id "groovy"
    id "eclipse"
}

group project_group // http://maven.apache.org/guides/mini/guide-naming-conventions.html

//GroovyShell shell = new GroovyShell(this.getClass().getClassLoader(), this.binding);
//shell.run(file, arguments);

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

println("Current version: $version")
println("Project: $group:${project.name}")
println("Bulding a Java $compileJava.targetCompatibility project...")

repositories {
    mavenCentral()
}

configurations {
    // configuration that holds jars to include in the jar
    implementation
    addToJar {
        canBeResolved true
    }
}

dependencies {
    api project(":logging")

    api "com.badlogicgames.gdx:gdx-backend-lwjgl3:1.14.2"

    api "it.unimi.dsi:fastutil-core:8.5.19"
    api "com.google.code.findbugs:jsr305:3.0.2"
    testImplementation "org.junit.jupiter:junit-jupiter-api:6.1.3"
    testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine:6.1.3"

    api "org.xbib.elasticsearch:joptsimple:6.3.2.1"
    api "org.apache.logging.log4j:log4j:2.26.1"
    api "org.apache.logging.log4j:log4j-core:2.26.1"
    api "org.apache.logging.log4j:log4j-api:2.26.1"

    api("net.fabricmc:fabric-loader:0.20.1") {
        exclude group: "org.ow2.asm"
        exclude group: "org.ow2.sat4j"
    }
}

processResources {
    inputs.property "version", version
    inputs.property "bubbles_version", project(":core").version
    inputs.property "libgdx_version", gdx_version

    filesMatching("fabric.mod.json") {
        expand "version": version
    }

    filesMatching("bubbles.metadata.json") {
        expand "version": version
    }

    filesMatching("versions.properties") {
        expand "bubble_blaster_version": project(":core").version, "libgdx_version": gdx_version
    }

    exclude("**/*.pdn")
    exclude("**/*.xcf")
    exclude("**/*.ps")
    exclude("**/*.tmp")
    exclude("**/*.bak")
    exclude("**/*.temp")
    exclude("**/*.cache")
    exclude("**/.cache")
}

repositories {
    maven {
        url = "https://maven.fabricmc.net"
        name = "FabricMC"
    }
}

jar {
    manifest {
        attributes 'Implementation-Title': 'Bubble Blaster',
                'Implementation-Vendor': 'Ultreon Team',
                project_version: project.version,
                'Main-Class': 'net.fabricmc.impl.launch.knot.KnotClient',
                'Multi-Release': 'true'
    }
    from(configurations.addToJar.collect {
        zipTree(it).matching {
            exclude "*.RSA", "*.SF", "*.MF"
        }
    })
    exclude "*.RSA", "*.SF", "*.MF"
    duplicatesStrategy DuplicatesStrategy.INCLUDE
}
test {
    useJUnitPlatform()
}
