plugins {
    id 'java-gradle-plugin' // so we can assign and ID to our plugin
    id 'org.jetbrains.kotlin.jvm' version "2.1.10"
    id 'java'
    id 'java-library'
}

dependencies {
    api 'org.ow2.asm:asm:9.11.1'
    api 'com.google.code.gson:gson:2.10.1'
    compileOnly api("gradle.plugin.org.jetbrains.gradle.plugin.idea-ext:gradle-idea-ext:1.1.8"), {
        exclude(group: 'com.google.guava', module: 'guava')
    }

    compileOnly api("com.google.guava:guava:33.7.1-jre")
}

java {
    sourceCompatibility = "11"
    targetCompatibility = "11"
}

repositories {
    mavenCentral()
    gradlePluginPortal()
}

gradlePlugin {
    plugins {
        register("gameutils") {
            id = "gameutils"
            implementationClass = "dev.ultreon.gameutils.GameUtilsPlugin"
        }
    }

}
