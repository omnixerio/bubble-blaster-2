//file:noinspection GroovyUnusedCatchParameter

import java.nio.file.Files
import java.nio.file.Paths

buildscript {
    repositories {
        mavenCentral()

        maven {
            url = "https://oss.sonatype.org/content/repositories/snapshots/"
            name = "sonatype"
        }

        maven {
            url = "https://maven.atlassian.com/3rdparty/"
        }

        google()
    }

    dependencies {
        classpath "commons-io:commons-io:2.22.0"
        classpath "com.google.code.gson:gson:2.14.0"
    }
}

//*****************//
//     Plugins     //
//*****************//
plugins {
    id 'java'
    id 'java-library'
    id 'maven-publish'
}

apply plugin: 'java'
apply plugin: 'maven-publish'

//****************************//
// Setting up main properties //
//****************************//

// Project properties.
group project_group

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

//**********************//
//     Repositories     //
//**********************//
repositories {
    mavenCentral()
    mavenLocal()
    google()
    maven {
        name "Atlassian"
        url "https://maven.atlassian.com/3rdparty/"
    }
    maven {
        name "Maven Central"
        url "https://repo1.maven.org/maven2/"
    }
    maven {
        name "RuneLite"
        url "https://repo.runelite.net/"
    }
    maven {
        name "FabricMC"
        url "https://maven.fabricmc.net/"
    }
    flatDir {
        name "Project Libraries"
        dirs "${projectDir}/libs"
    }
}

/**
 * Dependencies
 */
dependencies {
    api "it.unimi.dsi:fastutil:8.5.19"

    api "org.jetbrains:annotations:26.1.0"

    api project(":logging")

    // Test dependencies
    testImplementation "org.junit.jupiter:junit-jupiter-api:5.9.0"
    testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine:5.9.0"

    // Misc
    api "org.jetbrains:annotations:23.0.0"
    api "com.electronwill.night-config:toml_android:3.6.6"

    // CoreLibs
    api "dev.ultreon.corelibs:collections-v0:0.3.0"
    api "dev.ultreon.corelibs:commons-v0:0.3.0"
    api "dev.ultreon.corelibs:crash-v0:0.3.0"
    api "dev.ultreon.corelibs:datetime-v0:0.3.0"
    api "dev.ultreon.corelibs:events-v1:0.3.0"
    api "dev.ultreon.corelibs:functions-v0:0.3.0"
    api "dev.ultreon.corelibs:registries-v0:0.3.0"
    api "dev.ultreon.corelibs:resources-v0:0.3.0"
    api "dev.ultreon.corelibs:text-v0:0.3.0"
    api "dev.ultreon.corelibs:translations-v0:0.3.0"
    api "dev.ultreon.corelibs:translations-v0:0.3.0"
    api "dev.ultreon:ubo:1.8.0"

    // Apis
    api "com.google.code.gson:gson:2.10.1!!"
    api "commons-io:commons-io:2.14.0"
    api "commons-net:commons-net:3.9.0"
    api "org.apache.commons:commons-lang3:3.18.0"
    api "org.apache.commons:commons-lang3:3.18.0"
    api "org.apache.commons:commons-collections4:4.4"
    api "org.apache.commons:commons-text:1.10.0"
    api "org.apache.commons:commons-math3:3.6.1"
    api "org.apache.ant:ant:1.10.18"

    api "com.badlogicgames.box2dlights:box2dlights:1.5"

    // Local jars.
    api fileTree(dir: "$projectDir/libs", include: ["*.jar"])

    // Google
    api "com.google.code.findbugs:jsr305:3.0.2"
    api "com.google.guava:guava:33.7.1-jre"
    api "com.google.code.gson:gson:2.10.1!!"

    // SLF4J
    api "org.slf4j:slf4j-api:2.0.6"

    // OSHi (For system info in crash reports)
    api "com.github.oshi:oshi-core:6.3.2"

    // LibGDX
    api "com.badlogicgames.gdx:gdx:1.14.2"
    api "com.badlogicgames.gdx:gdx-box2d:1.14.2"
    api "com.badlogicgames.ashley:ashley:1.7.4"
    api "com.badlogicgames.gdx:gdx-ai:1.8.2"
    api "com.badlogicgames.gdx-controllers:gdx-controllers-core:2.2.3"
    api "com.badlogicgames.gdx:gdx-freetype:1.14.2"
    api "com.badlogicgames.box2dlights:box2dlights:1.5"
    api "space.earlygrey:shapedrawer:2.6.0"

    // GDX Visual Effects
    api 'com.crashinvaders.vfx:gdx-vfx-core:0.5.0'
    api 'com.crashinvaders.vfx:gdx-vfx-effects:0.5.0'    // Optional, if you need standard filter/effects.
}

processResources {
    inputs.property "version", version

    filesMatching("fabric.mod.json") {
        expand "version": version
    }

    from(file("NOTICE.txt")) { into "META-INF/" }
    from(file("$rootProject.projectDir/LICENSE")) { into "META-INF/" }

    exclude("**/*.pdn")
    exclude("**/*.xcf")
    exclude("**/*.ps")
    exclude("**/*.tmp")
    exclude("**/*.bak")
    exclude("**/*.temp")
    exclude("**/*.cache")
    exclude("**/.cache")
}

compileJava.dependsOn processResources

jar {
    dependsOn ":gameprovider:jar"

    //noinspection GroovyAssignabilityCheck
    manifest {
        //noinspection GroovyAssignabilityCheck
        attributes 'Implementation-Title': 'Bubble Blaster 2',
                'Implementation-Vendor': 'Ultreon Team',
                project_version: project.project_version,
                'Main-Class': 'net.fabricmc.impl.launch.knot.KnotClient',
                'Multi-Release': 'true'
    }

    from {
        compileJava.outputs
    }
    from {
        processResources.outputs
    }

    zip64 true
    duplicatesStrategy DuplicatesStrategy.INCLUDE
}

processResources {
}

test {
    useJUnitPlatform()
}

tasks.create('prepareRun', {
    Files.createDirectories(Paths.get(rootProject.projectDir.getAbsolutePath(), "run"))
})

tasks.withType(JavaCompile).configureEach {
    options.fork = true
    options.incremental = true
}

tasks.withType(ProcessResources).configureEach {
    duplicatesStrategy DuplicatesStrategy.INCLUDE
}

tasks.withType(Jar).configureEach {
    duplicatesStrategy DuplicatesStrategy.INCLUDE
}

build {
//    mustRunAfter ":packedJar"
}

task createExec {
    doFirst {
        if (!file("build").exists()) {
            mkdir "build"
        }
        mkdir "build/exec/"
        if (file("build/exec/lib/").exists()) {
            delete fileTree("build/exec/lib/")
        }
        copy {
            from file("bin/start.bat")
            into file("build/exec/")
        }
        copy {
            from file("bin/start-unix.sh")
            into file("build/exec/")
        }
        copy {
            from file("bin/start-mac.sh")
            into file("build/exec/")
        }
        copy {
            from jar.outputs.files.singleFile
            into file("build/exec/")
            rename ".*", "bubbles.jar"
        }
        mkdir "build/exec/lib/"
        copy {
            from fileTree("build/dependencies/")
            into file("build/exec/lib/")
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

task("copyDependencies", type: Copy) {
    from(configurations.runtimeClasspath)
    into("${layout.buildDirectory.asFile.get()}/jars")
}

task("copyJar", type: Copy) {
    from(tasks.jar)
    into("${layout.buildDirectory.asFile.get()}/jars")
}

println('Java: ' + System.getProperty('java.version') + ' JVM: ' + System.getProperty('java.vm.version') + '(' + System.getProperty('java.vendor') + ') Arch: ' + System.getProperty('os.arch'))
println("OS: " + System.getProperty("os.name") + " Version: " + System.getProperty("os.version"))

println("Current version: $version")
println("Project: " + group + ":" + project.name)
println("Bulding a Java " + compileJava.targetCompatibility + " project...")
